<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube Timer</title>
<style>
  :root{
    --bg:#12141a; --panel:#1b1f28; --panel2:#232936; --line:#333b4a;
    --fg:#e8ecf3; --muted:#98a2b3; --accent:#4da3ff; --ok:#3ddc84; --warn:#ffb020; --err:#ff5f56;
    --a:#4da3ff; --b:#ff9f43;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:14px;background:var(--bg);color:var(--fg);
    font-family:"Helvetica Neue",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%}
  h1{font-size:18px;margin:0}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:bold}
  button:disabled{opacity:.4;cursor:default}
  button.small{padding:4px 9px;font-size:11px}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;font-size:12px;font-family:inherit}
  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .topbar .opt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .spacer{flex:1}
  .wake{border-radius:10px}
  .wake.on{background:var(--ok);border-color:var(--ok);color:#06121f;font-weight:bold}
  .wake.ng{color:var(--warn);border-color:var(--warn)}

  .msg{font-size:12px;min-height:18px;margin:0 0 10px;color:var(--warn)}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

  .board{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
  .side{flex:1 1 420px;min-width:320px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;border-top:6px solid var(--line)}
  /* the band over the cube lights up only once that side has a cube or a recording */
  .side[data-k="A"].live{border-top-color:var(--a)}
  .side[data-k="B"].live{border-top-color:var(--b)}
  .side .sidetop{display:flex;gap:10px;align-items:center;margin-bottom:6px;min-height:30px}
  /* the row over the cube stays one height whatever sits in it */
  .side .sidetop select,.side .sidetop button{font-size:11px;padding:4px 9px;border-radius:7px}
  .pickrow{display:flex;justify-content:center;margin:6px 0 2px}
  .pickrow:empty{display:none}
  .pickrow select{font-size:18px;padding:8px 14px;border-radius:10px;font-weight:bold}
  .btnConn.on{background:var(--ok);border-color:var(--ok);color:#06121f;font-weight:bold}
  .ghostload:empty{display:none}
  .tag{font-size:22px;font-weight:bold;letter-spacing:.08em;margin-right:2px}
  .side[data-k="A"] .tag, .setside[data-k="A"] .tag{color:var(--a)}
  .side[data-k="B"] .tag, .setside[data-k="B"] .tag{color:var(--b)}

  /* the list of times, between the two players */
  .times{flex:0 1 270px;min-width:230px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;align-self:flex-start}
  .times h2{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:normal;letter-spacing:.05em}
  .battle{width:100%;font-size:22px;font-weight:bold;letter-spacing:.06em;padding:18px 10px;
    margin-bottom:14px;background:var(--accent);border-color:var(--accent);color:#06121f;border-radius:12px}
  .battle:disabled{background:var(--panel2);border-color:var(--line);color:var(--muted);opacity:.55}
  .battle:hover:not(:disabled){filter:brightness(1.1)}
  .again{width:100%;font-size:15px;font-weight:bold;letter-spacing:.04em;padding:11px 10px;
    margin:-8px 0 14px;border-radius:10px;background:#16324a;border-color:var(--accent);color:var(--accent)}
  .battle.rst{background:var(--panel2);border-color:var(--line);color:var(--fg)}
  .setbtn{width:100%;font-size:12px;padding:7px 10px;margin:0 0 14px;border-radius:10px}
  #setbox{margin:0 0 14px}
  #scrIn{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--accent);
    border-radius:8px;padding:8px;font-size:13px;font-family:inherit}
  .setrow2{display:flex;gap:6px;margin-top:6px}
  .setrow2 button{flex:1}
  .again:hover:not(:disabled){filter:brightness(1.25)}
  .again:disabled{background:var(--panel2);border-color:var(--line);color:var(--muted);opacity:.55}
  .trow{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:baseline;
    padding:6px 4px;border-radius:8px;font-variant-numeric:tabular-nums}
  .trow .n{color:var(--muted);font-size:12px}
  .trow .n.del{cursor:pointer}
  .trow .n.del:hover{color:var(--err);text-decoration:line-through}
  .trow .ta,.trow .tb{text-align:right;font-size:21px;font-weight:bold;color:var(--fg)}
  .trow .ta.none,.trow .tb.none{color:#3d4453;font-weight:normal}
  .trow .ta.win,.trow .tb.win{color:var(--ok)}
  .trow .ta.dnf,.trow .tb.dnf{color:var(--err);font-size:15px}
  .trow .mv{font-size:11px;font-weight:normal;color:var(--muted);margin-left:4px}
  .trow.thead .ta,.trow.thead .tb{font-size:13px;font-weight:bold;letter-spacing:.08em}
  .trow.thead .ta{color:var(--a)} .trow.thead .tb{color:var(--b)}
  .trow.cur{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
  #timesHead{margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
  #timesHead .trow .n{font-size:11px;letter-spacing:.04em}
  .trow.big .ta,.trow.big .tb{font-size:30px}
  .trow.small .ta,.trow.small .tb{font-size:14px;font-weight:normal;color:var(--muted)}
  .times .empty{font-size:12px;color:var(--muted);padding:6px 4px}

  /* setup, kept out of the way at the bottom */
  .settings{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
  .setside{flex:1 1 460px;min-width:340px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px;border-top:3px solid var(--line)}
  .setside[data-k="A"]{border-top-color:var(--a)}
  .setside[data-k="B"]{border-top-color:var(--b)}
  .setrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;
    border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--err)}
  .dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
  .colorRow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .colorRow .lab{font-size:11px;color:var(--muted)}
  .chip{width:20px;height:20px;border-radius:6px;border:1px solid #0d0f13;display:inline-block;vertical-align:middle}
  .macinfo{font-size:11px;color:var(--muted);flex:1;min-width:110px;text-align:right}
  .ghostslot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ghostinfo{font-size:11px;color:var(--muted);flex:1;min-width:110px;text-align:right}

  .timer{font-size:74px;font-weight:bold;font-variant-numeric:tabular-nums;line-height:1.05;
    letter-spacing:-.02em;text-align:center;margin:2px 0 4px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;column-gap:9px}
  .timer .tnum{grid-column:2}       /* the number stays centred whatever is beside it */
  .timer .tmeta{grid-column:3;justify-self:start;min-width:0;overflow:hidden;
    font-size:13px;font-weight:normal;letter-spacing:0;color:var(--muted);white-space:nowrap}
  .scrtime{text-align:center;font-size:11px;color:var(--muted);min-height:14px;margin:-2px 0 4px}
  .timer.word{font-size:56px;letter-spacing:.06em}
  .timer.ready{color:var(--ok)}
  .timer.go{color:var(--accent)}
  .timer.dnf{color:var(--err)}
  .timer.insp{color:var(--warn)}
  .timer.over{color:var(--err)}
  .timer.run{color:var(--accent)}
  .timer.done{color:var(--ok)}
  .phasemsg{text-align:center;font-size:12px;color:var(--muted);min-height:18px;margin-bottom:10px}
  .splits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .splits > div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:7px 4px;text-align:center}
  .splits .lab{font-size:10px;color:var(--muted);letter-spacing:.04em}
  .splits .val{font-size:22px;font-weight:bold;font-variant-numeric:tabular-nums;margin-top:2px}
  .splits > div.hit{border-color:var(--ok)}

  .scrall{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);
    line-height:1.9;letter-spacing:.02em;min-height:22px;word-break:break-word}
  .scrall .done{color:#4b5565}
  .scrall .now{color:var(--fg);font-weight:bold}
  .scrall .cnt{margin-left:10px;font-size:11px}
  .bigseq{height:74px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:4px 0}
  .seqline{display:flex;gap:16px;font-family:ui-monospace,Menlo,monospace;font-size:38px;font-weight:bold}
  .seqline .grp{display:flex;gap:16px}
  .seqline .tok{color:#5b6472;transition:color .12s}
  .seqline .tok.p0{color:var(--fg)} .seqline .tok.p1{color:#9aa4b2} .seqline .tok.p2{color:#6c7686}
  .seqline .tok.nowtok{color:var(--warn)}
  .seqline .tok.corr, .seqline .tok.corr.p0, .seqline .tok.corr.nowtok{color:var(--err)}
  .seqline .half{opacity:.55}
  .seqline .msg{font-size:24px;color:var(--muted);font-weight:normal}
  .seqline.sl{animation:sl .13s ease-out} .seqline.sr{animation:sr .13s ease-out}
  @keyframes sl{from{transform:translateX(46px)}to{transform:none}}
  @keyframes sr{from{transform:translateX(-46px)}to{transform:none}}
  .fixbox{font-size:12px;min-height:18px;text-align:center;margin-bottom:8px}
  .giverow{text-align:center;margin-bottom:10px}
  .giverow button{border-color:#5a3b3b;color:#e2a3a3}
  .giverow button:hover:not(:disabled){border-color:var(--err);color:var(--err)}

  .stage{height:210px;display:flex;align-items:center;justify-content:center;
    perspective:900px;touch-action:none;cursor:grab;user-select:none}
  .stage:active{cursor:grabbing}
  .cube3d{position:relative;width:130px;height:130px;transform-style:preserve-3d}
  .face3d{position:absolute;width:130px;height:130px;display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;
    background:#0d0f13;padding:3px;border-radius:6px;backface-visibility:hidden}
  .face3d div{border-radius:3px}

  .results{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .results h2{font-size:12px;color:var(--muted);margin:0;font-weight:normal;letter-spacing:.05em}
  .reshead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .sortnote{font-size:11px;color:var(--muted)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:normal;font-size:11px}
  th:first-child,td:first-child{text-align:left}
  td.win{color:var(--ok);font-weight:bold}
  td.sp{font-size:11px;color:var(--muted)}
  .tot{border-top:2px solid var(--line)}
  td.del{cursor:pointer}
  td.del:hover{color:var(--err);text-decoration:line-through}
  .empty{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="topbar">
  <h1>Cube Timer</h1>
  <label class="opt">Scramble <select id="selLen"></select></label>
  <label class="opt">Digits <select id="selPrec">
    <option value="2">0.01 s</option><option value="3">0.001 s</option></select></label>
  <button id="btnReset">Reset ALL</button>
  <!-- the ghost controls live with side B: the two below move into its cube panel
       and the two above it into the row over its cube, once the sides are built -->
  <button id="btnGhost">Load</button>
  <select id="selGhostSes" style="display:none"></select>
  <select id="selGhostNo" style="display:none" title="Which recorded solve to race"></select>
  <button id="btnGhostOff" style="display:none">Leave ghost</button>
  <input type="file" id="fileGhost" accept=".txt,.json,text/*" style="display:none">
  <span class="spacer"></span>
  <span class="opt" id="engineInfo">Engine preparing…</span>
  <button id="btnWake" class="wake">Screen On</button>
</div>

<div class="msg" id="msg"></div>

<div class="board">
  <section class="side" data-k="A"></section>
  <section class="times">
    <button id="btnBattle" class="battle">NEXT SCRAMBLE</button>
    <button id="btnAgain" class="again" disabled>Same Scramble</button>
    <button id="btnSet" class="setbtn">Set Scramble</button>
    <div id="setbox" style="display:none">
      <input id="scrIn" placeholder="R L U2 R' …" autocomplete="off" spellcheck="false">
      <div class="setrow2"><button id="btnSetGo" class="small primary">Start</button>
        <button id="btnSetNo" class="small">Cancel</button></div>
    </div>
    <div class="trow thead"><span class="n"></span><span class="ta">A</span><span class="tb">B</span></div>
    <div id="timesHead"></div>
    <h2>Last 5 rounds</h2>
    <div id="timesBody"></div>
  </section>
  <section class="side" data-k="B"></section>
</div>

<div class="settings">
  <section class="setside" data-k="A"></section>
  <section class="setside" data-k="B"></section>
</div>

<div class="results">
  <div class="reshead"><h2>Rounds</h2>
    <button id="btnSortKey" class="small">Sort by time</button>
    <button id="btnSortDir" class="small">Reverse</button>
    <span class="sortnote" id="sortnote"></span>
    <span class="spacer"></span>
    <button id="btnSave" class="small">Save session</button>
    <button id="btnLoad" class="small">Load session</button>
    <input type="file" id="fileSess" accept=".json,.txt,application/json,text/*" style="display:none"></div>
  <div id="resWrap"><div class="empty">No rounds yet.</div></div>
</div>

/** A random scramble: no face twice in a row, and no sandwiching of opposite faces */
function makeScramble(n){
  const out = []; let p1 = "", p2 = "";
  while(out.length < n){
    const f = FACES[Math.floor(Math.random()*6)];
    if(f === p1) continue;
    if(f === p2 && OPP[f] === p1) continue;
    out.push(MK(f, [1,2,3][Math.floor(Math.random()*3)]));
    p2 = p1; p1 = f;
  }
  return out;
}

/* --- The scramble engine ---
   Building its tables takes a couple of seconds, so it is done once in the
   background. From two states it gives the moves that lead from one to the other. */
let solverReady = false, solverFailed = false;
function solverInit(){
  if(solverReady || solverFailed) return solverReady;
  if(typeof Cube === "undefined" || !Cube.initSolver){ solverFailed = true; paintEngine(); return false; }
  try{ Cube.initSolver(); solverReady = true; }
  catch(e){ console.error(e); solverFailed = true; }
  paintEngine();
  return solverReady;
}
function paintEngine(){
  const el = $("engineInfo"); if(!el) return;
  el.textContent = solverReady ? "Engine ready" : solverFailed ? "Engine not available" : "Engine preparing…";
}
/** The moves that turn state `cur` into state `target` (about 20 of them), or null */
function pathBetween(cur, target){
  if(cur === target) return [];
  if(!solverInit()) return null;
  try{
    const back = Cube.fromString(cur).solve();      // cur → solved
    const inv = new Cube(); inv.move(back);         // the state of cur⁻¹
    inv.multiply(Cube.fromString(target));          // cur⁻¹ · target
    const alg = Cube.inverse(inv.solve());
    return alg ? alg.split(" ").filter(Boolean) : [];
  }catch(e){ console.error(e); return null; }
}

  const a = audioReady(); if(!a) return;
  try{

    o.type = "square"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.15);
    o.connect(g); g.connect(a.destination);

function phasesFor(crossFace){
  const top = OPP[crossFace];
  const crossEdges = ALL_E.filter(s => pieceHas(s, crossFace));
  const lower = PIECES.filter(s => !pieceHas(s, top));
  return {
    cross: st => crossEdges.every(s => pieceOK(st,s)),
    f2l:   st => lower.every(s => pieceOK(st,s)),
    oll:   st => lower.every(s => pieceOK(st,s)) &&
                 [0,1,2,3,4,5,6,7,8].every(i => st[FACE_IDX[top]+i] === top)

  let err = null;
