    try{ const srv = await dev.gatt.connect(); await sleep(150); if(srv.connected) return srv; }
    catch(e){ err = e; }
    await sleep(400);
  }
  if(err) throw err;
  return dev.gatt.connect();
};
window.__gattServices = async (srv, dev) => {
  let err = null, got = null;
  for(let i=0;i<6;i++){
    try{
      if(!srv.connected){ srv = await dev.gatt.connect(); await sleep(150); }
      const list = await srv.getPrimaryServices();
      if(list && list.length) return list;
      got = list || [];
    }catch(e){ err = e; }
    await sleep(400);
  }
  if(got) return got;
  throw err || new Error("Could not get the cube's services");
};
/** Turn a connection error into advice that can be acted on */
function connectErrorMessage(err){
  const m = (err && err.message) ? err.message : String(err);
  if(/cancell?ed|chooser/i.test(m)) return "Connection canceled.";
  if(/globally disabled|adapter|not available|turned off/i.test(m))
    return "Bluetooth seems to be off. Turn it on and try again.";
  if(/MAC address/i.test(m))
    return "The MAC address of this cube is unknown, so it cannot be connected."
         + " Press “Enter / edit” next to MAC and type this cube's own address.";
  if(/unsupported cube device model/i.test(m))
    return "This cube did not answer as a GAN cube. Either it is not a supported model, or the MAC address"
         + " saved for it belongs to a different cube — press Clear next to MAC and try again.";
  if(/GATT|disconnect|Connection|services|failed/i.test(m))
    return "Could not reach the cube. Turn it a few times to wake it up and press Connect again."
         + " (It may also fail if another app or tab is using that cube.)";
  return "Could not connect: " + m;
}

/* ============================================================
   4. One side of the battle
   ============================================================ */
/* IDLE → SCRAMBLE → WAIT (this cube is scrambled, the other one is not yet)
   → READY (both are scrambled; the first turn starts the clock) → SOLVING → DONE.
   A turn made during WAIT is too early: it beeps and counts as a mis-scramble. */
const IDLE = 0, SCRAMBLE = 1, WAIT = 2, READY = 3, SOLVING = 4, DONE = 5;
const SEQ_N = 5;
let prec = +LS.get("prec","2") === 3 ? 3 : 2;    // 1/100 s or 1/1000 s on screen
const fmt  = ms => ms == null ? "—" : (ms/1000).toFixed(prec);

/* The playing side: the cube first, then the time, then the scramble. */
const SIDE_HTML = `
  <div class="sidetop">
    <span class="tag"></span>
    <button class="btnConn primary">Connect</button>
    <span class="ghostload"></span>
    <button class="btnSolved small">Reset cube</button>
  </div>
  <div class="stage"><div class="cube3d"></div></div>
  <div class="timer"><span class="tnum">0.00</span><span class="tmeta"></span></div>
  <div class="phasemsg">&nbsp;</div>
  <div class="scrtime">&nbsp;</div>
  <div class="splits">
    <div class="sCross"><div class="lab">Cross</div><div class="val">—</div></div>
    <div class="sF2L"><div class="lab">F2L</div><div class="val">—</div></div>
    <div class="sOLL"><div class="lab">OLL</div><div class="val">—</div></div>
    <div class="sPLL"><div class="lab">PLL</div><div class="val">—</div></div>
  </div>
  <div class="giverow"><button class="btnRecalc small">Recalc scramble</button>
    <button class="btnGive small">Give up</button></div>
  <div class="pickrow"></div>
  <div class="scrall"></div>
  <div class="bigseq"></div>
  <div class="fixbox">&nbsp;</div>`;

/* Everything that is set up once and then left alone lives at the bottom of the page. */
const SET_HTML = `
  <div class="setrow">
    <span class="tag"></span>
    <span class="pill batt">Battery —</span>
  </div>
  <div class="colorRow">
    <span class="lab">Top face</span><span class="chip tchip"></span><select class="selTop"></select>
    <span class="lab">Front face</span><span class="chip fchip"></span><select class="selFront"></select>
  </div>
  <div class="colorRow">
    <label class="lab" style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" class="optScrStd"> Scramble in the standard orientation (white top, green front)
    </label>
  </div>
  <div class="colorRow">
    <span class="lab">Cube</span><span class="devname">—</span>
    <span class="lab">MAC</span><span class="macinfo">not saved</span>
    <button class="btnMac small">Enter / edit</button>
    <button class="btnMacClear small">Clear</button>
  </div>
  <div class="colorRow">
    <span class="lab">This player's times</span>
    <button class="btnExport small">Export for csTimer</button>
    <button class="btnText small">Save as text</button>
    <label class="lab" style="display:flex;align-items:center;gap:5px;cursor:pointer">
      <input type="checkbox" class="optBest"> Only the best time per scramble</label>
    <span class="expinfo"></span>
  </div>
  <div class="colorRow ghostrow">
    <span class="lab">Ghost</span>
    <span class="ghostslot"></span>
    <span class="ghostinfo"></span>
  </div>`;

function makeSide(root, sroot, key, ctl){
  root.innerHTML = SIDE_HTML;
  sroot.innerHTML = SET_HTML;
  const q = c => root.querySelector("." + c) || sroot.querySelector("." + c);
  root.querySelector(".tag").textContent = key;
  sroot.querySelector(".tag").textContent = key;

  /* --- what this side holds --- */
  /* The player picks the colour that is UP. The cross is the face opposite it. */
  let topCol = LS.get(key+".top", OPPC[LS.get(key+".cross", "W")] || "Y");
  let frontCol = LS.get(key+".front", "G");
  let REF = Object.assign({}, STD_REF);
  let crossFace = "U", frontFace = "F", ORI = null, PH = null;
  let conn = null, battTimer = null, device = null, facWarned = false, live = false;
  let state = SOLVED, phase = IDLE;
  let A = {S:[], rem:[]}, lastLen = -1, target = SOLVED, recalced = false;
  let lastShown = null;                 // the round just played, kept up during the next scramble
  let startState = SOLVED, mvLog = [];  // where the solve began, and every move of it with its time
  let ghostMode = false;                // this side is a recording, not a cube
  let t0 = 0, tCross = 0, tF2L = 0, tOLL = 0, tEnd = 0;
  let tShown = 0, tScr0 = 0;            // when the scramble came up, and its first turn
  let exactMs = null;                   // a ghost finishes on the time it was recorded at
  let nMoves = 0, lastFace = null, tick = null, result = null;

  /* --- the cube on screen --- */
  const cells3d = [];
  FACES.forEach((f,fi) => {
    const d = document.createElement("div");
    d.className = "face3d"; d.style.transform = FACE_T[f];
    for(let i=0;i<9;i++){ const s = document.createElement("div"); d.appendChild(s); cells3d[fi*9+i] = s; }
    q("cube3d").appendChild(d);
  });
  const VIEW0 = {x:-22, y:-30};                    // top face up, front face towards you
  let viewX = VIEW0.x, viewY = VIEW0.y;
  const applyView = () => q("cube3d").style.transform = `rotateX(${viewX}deg) rotateY(${viewY}deg)`;
  const resetView = () => { viewX = VIEW0.x; viewY = VIEW0.y; applyView(); };
  (function(){
    const st = q("stage"); let drag = false, px = 0, py = 0;
    const pt = e => e.touches ? {x:e.touches[0].clientX, y:e.touches[0].clientY} : {x:e.clientX, y:e.clientY};
    const down = e => { drag = true; const p = pt(e); px = p.x; py = p.y; };
    const move = e => { if(!drag) return; const p = pt(e);
      viewY += (p.x-px)*0.5; viewX -= (p.y-py)*0.5; px = p.x; py = p.y; applyView();
      if(e.cancelable) e.preventDefault(); };
    st.addEventListener("mousedown", down); window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", () => drag = false);
    st.addEventListener("touchstart", down, {passive:true});
    st.addEventListener("touchmove", move, {passive:false});
    /* a double click — or a double tap — puts the view back where it started */
    st.addEventListener("dblclick", resetView);
    let lastTap = 0;
    st.addEventListener("touchend", e => {
      drag = false;
      const now = Date.now();
      if(now - lastTap < 300){ resetView(); lastTap = 0; } else lastTap = now;
    });
    st.title = "Drag to turn the view — double click to put it back";
  })();

  /* --- holding the cube: which color is down, which is in front --- */
  const faceOfColor = c => FACES.find(f => REF[f] === c);
  function applyScheme(){
    if(!adjacent(topCol).includes(frontCol)) frontCol = adjacent(topCol)[0];
    const topFace = faceOfColor(topCol);
    crossFace = OPP[topFace];               // the cross is made on the face underneath
    frontFace = faceOfColor(frontCol);
    PH  = phasesFor(crossFace);
    ORI = D.ori[topFace + frontFace] || D.ori["UF"];
    const VCOL = {};                        // symbol on screen → color
    for(const o of FACES) VCOL[ORI.face[o]] = REF[o];
    for(const k in VCOL){ root.style.setProperty("--c"+k, COL_HEX[VCOL[k]]);
                          sroot.style.setProperty("--c"+k, COL_HEX[VCOL[k]]); }
    LS.set(key+".top", topCol); LS.set(key+".front", frontCol);
    renderPickers(); render();
  }
  const toView = st => { let o = ""; for(let j=0;j<54;j++) o += ORI.face[st[ORI.perm[j]]]; return o; };
  /** the same state seen with white on top and green in front — csTimer's own frame */
  function stdOri(){
    const u = faceOfColor("W"), f = faceOfColor("G");
    return (u && f && D.ori[u + f]) || D.ori["UF"];
  }
  const stdState = st => { const O = stdOri();
    let o = ""; for(let j=0;j<54;j++) o += O.face[st[O.perm[j]]]; return o; };
  const viewFace = f => (ORI && ORI.face[f]) || f;
  const viewTok  = t => viewFace(t[0]) + t.slice(1);
  /* The scramble can be written either the way this player holds the cube, or in
     the standard orientation (white on top, green in front) that scrambles
     normally assume. Only the scramble changes — the cube on screen does not. */
  let scrStd = LS.get(key+".scrstd","0") === "1";
  const scrFace = f => scrStd ? (stdOri().face[f] || f) : viewFace(f);
  const scrTok  = t => scrFace(t[0]) + t.slice(1);
  const entryLabel = e => scrFace(e.f) + (e.kind === "double" ? "2" : e.kind === "ccw" ? "'" : "");
  function renderPickers(){
    const opt = (list, cur) => list.map(c =>
      `<option value="${c}"${c === cur ? " selected" : ""}>${COL_NAME[c]}</option>`).join("");
    q("selTop").innerHTML = opt(Object.keys(COL_HEX), topCol);
    q("selFront").innerHTML = opt(adjacent(topCol), frontCol);
    q("tchip").style.background = COL_HEX[topCol];
    q("fchip").style.background = COL_HEX[frontCol];
  }
  q("selTop").onchange = () => { topCol = q("selTop").value; applyScheme(); };
  q("optScrStd").checked = scrStd;
  q("optScrStd").onchange = () => {
    scrStd = q("optScrStd").checked;
    LS.set(key+".scrstd", scrStd ? "1" : "0");
    render();
  };
  q("selFront").onchange = () => { frontCol = q("selFront").value; applyScheme(); };

  /* --- turning the scramble, with a nudge back when a wrong move is made --- */
  function tokenToEntry(t, corr){
    const amt = t.endsWith("2") ? 2 : t.endsWith("'") ? 3 : 1;
    return {f:t[0], kind: amt === 2 ? "double" : amt === 3 ? "ccw" : "cw",
            corr:!!corr, prog:0, hdir:0};
  }
  const buildRem = () => { A.rem = A.S.map(t => tokenToEntry(t, false)); };
  function prependCorrection(face, dir){
    A.rem.unshift(tokenToEntry(dir > 0 ? face + "'" : face, true));
    /* four quarter turns the same way bring the face back where it was,
       so the four moves waiting to be put right cancel out */
    const e0 = A.rem[0];
    let n = 0;
    while(A.rem[n] && A.rem[n].corr && A.rem[n].f === e0.f
          && A.rem[n].kind === e0.kind && !A.rem[n].prog) n++;
    if(n >= 4) A.rem.splice(0, 4);
  }
  function handleQuarter(face, dir){
    const e = A.rem[0];
    if(!e || e.f !== face){ prependCorrection(face, dir); return; }
    if(e.kind === "double"){
      if(e.prog === 0){ e.prog = 1; e.hdir = dir; return; }   // turned halfway
      if(dir === e.hdir){ A.rem.shift(); return; }            // the other half
      e.prog = 0; e.hdir = 0; return;                         // turned halfway and back
    }
    if(dir === (e.kind === "cw" ? 1 : -1)){ A.rem.shift(); return; }
    prependCorrection(face, dir);
  }
  function feed(m){
    const face = m[0], dir = m.indexOf("'") >= 0 ? -1 : 1, reps = m.endsWith("2") ? 2 : 1;
    /* A half turn is the same whichever way it goes, so when two quarter turns of
       that face are waiting — "R' R'", say — turning R2 settles both of them. */
    if(reps === 2){
      const e0 = A.rem[0], e1 = A.rem[1];
      if(e0 && e1 && e0.f === face && e1.f === face && e0.kind === e1.kind
         && e0.kind !== "double" && !e0.prog && !e1.prog){
        A.rem.shift(); A.rem.shift(); return;
      }
    }
    for(let r=0;r<reps;r++) handleQuarter(face, dir);
  }
  const scrambleDone = () => A.rem.length === 0;
  const remLeft      = () => A.rem.filter(e => !e.corr).length;
  const needsFix     = () => !!(A.rem[0] && A.rem[0].corr);
  const untouched    = () => A.rem.length === A.S.length && A.rem.every(e => !e.corr && !e.prog);

  /* --- drawing --- */
  function render(){
    const v = toView(state);
    for(let i=0;i<54;i++) cells3d[i].style.background = "var(--c" + v[i] + ")";
    const big = q("bigseq"), all = q("scrall");
    if(!A.S.length){ big.innerHTML = ""; all.innerHTML = ""; lastLen = -1; }
    else if(scrambleDone()){
      big.innerHTML = '<div class="seqline"><span class="grp"><span class="msg">'
        + (phase === WAIT ? "Wait" : phase === READY ? "Ready" : phase === SOLVING ? "Timing"
           : phase === DONE ? (result && result.dnf ? "Gave up" : "Solved!") : "Ready")
        + "</span></span></div>";
      all.innerHTML = A.S.map(t => `<span class="done">${scrTok(t)}</span>`).join(" ");
      lastLen = -1;
    } else {
      let cls = "";
      if(lastLen >= 0 && A.rem.length < lastLen) cls = " sl";
      else if(lastLen >= 0 && A.rem.length > lastLen) cls = " sr";
      lastLen = A.rem.length;
      const cells = A.rem.slice(0, SEQ_N).map((e,k) => {
        let c = "tok p" + k + (k === 0 ? " nowtok" : "") + (e.corr ? " corr" : "");
        if(e.kind === "double" && e.prog === 1) c += " half";
        return `<span class="${c}">${entryLabel(e)}</span>`;
      }).join("");
      big.innerHTML = `<div class="seqline${cls}"><span class="grp">${cells}</span></div>`;
      const left = remLeft(), doneN = A.S.length - left, fixing = needsFix();
      all.innerHTML = A.S.map((t,k) => {
        const c = k < doneN ? "done" : (k === doneN && !fixing) ? "now" : "";
        return `<span class="${c}">${scrTok(t)}</span>`;
      }).join(" ");
    }
    q("fixbox").innerHTML = needsFix()
      ? '<span style="color:var(--err)">Turn the red moves to get back on track</span>' : "&nbsp;";
    q("btnGive").disabled = ghostMode || phase === IDLE || phase === DONE;
    statusLine();
  }
  function showTime(ms, cls, prefix){
    q("tnum").textContent = (prefix || "") + (ms/1000).toFixed(prec);
    q("timer").className = "timer" + (cls ? " " + cls : "");
  }
  /** Wait / Ready / DNF are shown in place of the number */
  function showText(text, cls){
    q("tnum").textContent = text;
    q("timer").className = "timer word" + (cls ? " " + cls : "");
    q("tmeta").textContent = "";
  }
  /** the small print to the right of the time: how many moves, and how fast */
  function showMeta(res){
    const el = q("tmeta");
    el.textContent = (res && !res.dnf && res.ms && res.moves)
      ? res.moves + " moves · " + (res.moves / (res.ms/1000)).toFixed(2) + " TPS" : "";
  }
  /** how long the scramble itself took — for interest only, it is never kept */
  function showScrTime(text, title){
    q("scrtime").innerHTML = text || "&nbsp;";
    q("scrtime").title = title || "";
  }
  /** the line under the timer: what this side should be doing right now */
  let verdictText = "";
  function statusLine(){
    if(verdictText){ q("phasemsg").innerHTML = verdictText; return; }
    q("phasemsg").innerHTML =
        phase === SCRAMBLE ? (needsFix() ? '<span style="color:var(--err)">Fix the red moves</span>'
                              : recalced ? "Turn the scramble (worked out for this cube)"
                                         : "Turn the scramble")
      : phase === WAIT     ? '<span style="color:var(--warn)">Scrambled — waiting for the other side</span>'
      : phase === READY    ? '<span style="color:var(--ok)">Turn to start</span>'
      : phase === SOLVING  ? '<span style="color:var(--accent)">Timing</span>'
      : phase === DONE     ? (result && result.dnf ? '<span style="color:var(--err)">Gave up</span>'
                              : ctl.otherDone(key) ? "Finished" : "Finished — waiting for the other side")
      : "&nbsp;";
  }
  function clearSplits(){
    ["sCross","sF2L","sOLL","sPLL"].forEach(c => {
      q(c).querySelector(".val").textContent = "—"; q(c).classList.remove("hit"); });
  }
  function showSplits(){
    const run = phase === SOLVING;
    const put = (c, v, hit) => { q(c).querySelector(".val").textContent = v;
      q(c).classList.toggle("hit", !!hit); };
    put("sCross", tCross ? fmt(tCross-t0) : (run ? "…" : "—"), tCross);
    put("sF2L",   tF2L   ? fmt(tF2L-tCross) : (run ? "…" : "—"), tF2L);
    put("sOLL",   tOLL   ? fmt(tOLL-tF2L) : (run ? "…" : "—"), tOLL);
    put("sPLL",   (tOLL && phase === DONE) ? fmt(tEnd-tOLL) : (run ? "…" : "—"), phase === DONE && tOLL);
  }
  /* the clock on screen: counting down during inspection, up while solving */
  function startTick(){
    stopTick();
    tick = setInterval(() => {
      if(phase === SOLVING){
        showTime(performance.now() - t0, "run");
        showSplits();
      }
    }, prec === 3 ? 11 : 31);          // the third decimal needs a faster refresh
  }
  function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }

  /* --- the run of one round --- */
  function startRound(seq){
    stopTick();
    target = seq.reduce((st,m) => applyMove(st,m), SOLVED);   // where this round has to end up
    recalced = false;
    let use = seq.slice();
    if(state !== SOLVED){          // e.g. after a give up: work out the way there from here
      const path = pathBetween(state, target);
      if(path){ use = path; recalced = true; }
    }
    A = {S: use, rem: []}; buildRem();
    phase = SCRAMBLE; result = null; verdictText = ""; exactMs = null;
    t0 = tCross = tF2L = tOLL = tEnd = 0; nMoves = 0; lastFace = null; lastLen = -1;
    /* the time and the splits of the round just played stay up until this
       scramble is finished — there is nothing else to look at meanwhile */
    tShown = performance.now(); tScr0 = 0;
    showScrTime("");
    if(lastShown && lastShown.dnf) showText("DNF", "dnf");
    else if(lastShown){ showTime(lastShown.ms, ""); showMeta(lastShown); }
    else { showTime(0, ""); showMeta(null); clearSplits(); }
    render();
  }
  /** this cube is scrambled; the other one may still be going */
  function toWait(){
    phase = WAIT;
    const now = performance.now();
    if(tScr0) showScrTime("Scramble " + fmt(now - tScr0) + " s",
                          "From the first turn. " + fmt(now - tShown) + " s since the scramble came up.");
    showText("Wait", "insp"); clearSplits(); render();
    ctl.onScrambled(key);
  }
  /** both cubes are scrambled — the next turn starts the clock */
  function setReady(){
    if(phase !== WAIT) return;
    phase = READY;
    showText("Ready", "ready"); render();
  }
  function finish(now){
    stopTick();
    phase = DONE; tEnd = now;
    if(!tCross) tCross = now;
    if(!tF2L) tF2L = now;
    if(!tOLL) tOLL = now;
    /* A ghost is replayed with one timer per recorded move, and the browser fires
       those a few milliseconds early or late, so the measured time would wander
       either side of the record. The recording is the truth: take its time, and
       scale the splits by the same tiny factor so they still add up. */
    const meas = tEnd - t0;
    const total = exactMs != null ? exactMs : meas;
    const f = (exactMs != null && meas > 0) ? exactMs / meas : 1;
    showTime(total, "done"); showMeta({ms: total, moves: nMoves}); showSplits(); render();
    /* everything csTimer wants: the state the solve began from (white on top,
       green in front) and the solve itself, move by move */
    const O = stdOri(), tok = t => O.face[t[0]] + t.slice(1);
    const mvLine = mvLog.map(e => {
      const t = tok(e[0]);
      return t.endsWith("2") ? (t[0] + "@" + e[1] + " " + t[0] + "@" + e[1]) : (t + "@" + e[1]);
    }).join(" ");
    result = {ms: total, cross: (tCross-t0)*f, f2l: (tF2L-tCross)*f, oll: (tOLL-tF2L)*f, pll: (tEnd-tOLL)*f,
              moves: nMoves, t: Date.now(), st0: stdState(startState), mv: mvLine,
              mvRaw: mvLog.slice()};   /* the same moves in this cube's own letters */
    lastShown = {ms: total, moves: nMoves};
    ctl.onDone(key);
  }
  /** Stop this side's attempt. The round still counts — as a DNF for this side. */
  function giveUp(){
    if(phase === IDLE || phase === DONE) return;
    stopTick();
    phase = DONE;
    result = {dnf:true, ms:null, cross:null, f2l:null, oll:null, pll:null, moves:nMoves,
              t: Date.now(), st0: stdState(startState)};
    lastShown = {dnf:true};
    showText("DNF", "dnf"); clearSplits(); render();
    ctl.onDone(key);
  }
  q("btnGive").onclick = giveUp;
  /** Work the scramble out again from the cube as it is now */
  function recalc(){
    if(phase === IDLE){ ctl.msg("Side " + key + ": start a match first.", "err"); return; }
    if(phase === SOLVING || phase === DONE){
      ctl.msg("Side " + key + ": the scramble can only be worked out again before the solve.", "err"); return; }
    const path = pathBetween(state, target);
    if(!path){ ctl.msg("Side " + key + ": the engine is not ready yet — try again in a moment.", "err"); return; }
    stopTick();
    A = {S: path, rem: []}; buildRem();
    recalced = true;
    phase = SCRAMBLE; lastLen = -1;
    if(lastShown && lastShown.dnf) showText("DNF", "dnf");
    else if(lastShown){ showTime(lastShown.ms, ""); showMeta(lastShown); }
    else { showTime(0, ""); showMeta(null); }
    render();
    ctl.msg("Side " + key + ": scramble worked out again from the cube as it is now ("
            + path.length + " moves).", "ok");
  }
  q("btnRecalc").onclick = recalc;
  q("btnExport").onclick = () => ctl.exportSide(key);
  q("btnText").onclick = () => ctl.textSide(key);
  q("optBest").checked = LS.get(key+".best","0") === "1";
  q("optBest").onchange = () => LS.set(key+".best", q("optBest").checked ? "1" : "0");
  function doMove(mv, ev){
    if(phase === IDLE || phase === DONE){ state = applyMove(state, mv); render(); return; }
    if(phase === SCRAMBLE){
      if(!tScr0) tScr0 = performance.now();     // the scramble is timed from its first turn
      feed(mv);
      state = applyMove(state, mv);
      if(scrambleDone()) toWait(); else render();
      return;
    }
    if(phase === WAIT){
      /* the other side is still scrambling, so this turn is too early: it beeps
         and goes back on the list in red, to be undone */
      beep();
      phase = SCRAMBLE;
      feed(mv);
      state = applyMove(state, mv);
      render();
      return;
    }
    if(phase === READY){
      phase = SOLVING; t0 = performance.now(); nMoves = 0; lastFace = null;
      startState = state; mvLog = [];
      startTick(); ctl.onStart(key);
    }
    state = applyMove(state, mv);
    if(mv[0] !== lastFace){ nMoves++; lastFace = mv[0]; }
    const now = performance.now();
    mvLog.push([mv, Math.round(now - t0)]);
    if(!tCross && PH.cross(state)) tCross = now;
    if(!tF2L && PH.f2l(state)){ if(!tCross) tCross = now; tF2L = now; }
    if(!tOLL && PH.oll(state)){ if(!tCross) tCross = now; if(!tF2L) tF2L = now; tOLL = now; }
    if(state === SOLVED){ finish(now); return; }
    render(); showSplits();
  }

  /* --- the cube itself --- */
  function setStatus(text, cls){
    /* the old status pill is gone: the coloured band over the cube and the
       Connect button say it all, so this only keeps the band in step */
    live = cls === "on" || ghostMode;
    root.classList.toggle("live", live);
  }
  let pendingMac = "";
  function renderMac(){
    const v = (device ? macGet(device) : "") || pendingMac;
    q("devname").textContent = (device && device.name) || "—";
    q("macinfo").textContent = v ? v : "not saved";
  }
  q("btnMac").onclick = () => {
    const cur = (device ? macGet(device) : "") || pendingMac;
    const mac = prompt("Side " + key + ": MAC address of "
      + (device && device.name ? "“" + device.name + "”" : "the cube for this side")
      + "\n(each cube has its own address — do not reuse the other cube's)"
      + "\nLeave it empty to clear it.", cur || "");
    if(mac === null) return;
    const v = mac.trim();
    if(!v){ if(device) macForget(device); pendingMac = ""; renderMac();
            ctl.msg("Side " + key + ": the saved MAC address was cleared."); return; }
    if(!MAC_RE.test(v)){ ctl.msg("Side " + key + ": wrong format (enter it like AB:12:34:5F:9E:AA).","err"); return; }
    if(device) macSave(device, v); else pendingMac = v;
    renderMac();
    ctl.msg("Side " + key + ": MAC address saved. Press Connect.","ok");
  };
  q("btnMacClear").onclick = () => {
    if(device) macForget(device);
    pendingMac = ""; renderMac();
    ctl.msg("Side " + key + ": the saved MAC address was cleared.");
  };
  async function connect(){
    if(!navigator.bluetooth){ ctl.msg("Web Bluetooth is not available in this environment.","err"); return; }
    try{
      setStatus("Connecting…","wait"); ctl.msg("");
      try{ if(conn) await conn.disconnect(); }catch(e){}
      conn = null;
      conn = await window.GanCube.connectGanCube(
        macProviderFor(key, d => { device = d; renderMac(); }, () => pendingMac));
      // the library may have worked the address out from the advertisement — keep it for next time
      if(device && device.mac && MAC_RE.test(device.mac)) macSave(device, device.mac);
      pendingMac = ""; renderMac();
      conn.events$.subscribe(ev => {
        if(ev.type === "MOVE") doMove(ev.move, ev);
        else if(ev.type === "FACELETS"){
          // while nothing has been turned yet, the cube and the screen should agree
          if((phase === IDLE || (phase === SCRAMBLE && untouched())) && ev.facelets !== state){
            facWarned = true;
            ctl.msg("Side " + key + ": the cube and the screen disagree. Solve that cube and press “Reset cube”.","warn");
          } else if(facWarned){ facWarned = false; ctl.msg(""); }
        }
        else if(ev.type === "BATTERY") q("batt").textContent = "Battery " + ev.batteryLevel + "%";
        else if(ev.type === "DISCONNECT") cleanup("Disconnected");
      });
      setStatus("Connected","on");
      paintConn();
      await conn.sendCubeCommand({type:"REQUEST_BATTERY"});
      await conn.sendCubeCommand({type:"REQUEST_FACELETS"});
      battTimer = setInterval(() => { conn && conn.sendCubeCommand({type:"REQUEST_BATTERY"}).catch(()=>{}); }, 60000);
      if(device && ctl.otherDevice(key) === device.id)
        ctl.msg("Both sides are connected to the same cube. Press Disconnect on one side and pick the other cube.","err");
      else ctl.msg("Side " + key + " is connected.","ok");
      ctl.paint();
    }catch(err){
      console.error(err);
      setStatus("Not connected",""); conn = null;
      paintConn();
      const who = device && device.name ? " (" + device.name + ")" : "";
      ctl.msg("Side " + key + who + ": " + connectErrorMessage(err), "err");
      renderMac();
    }
  }
  function cleanup(text){
    if(battTimer){ clearInterval(battTimer); battTimer = null; }
    conn = null; setStatus("Not connected","");
    paintConn();
    q("batt").textContent = "Battery —";
    if(text) ctl.msg("Side " + key + ": " + text);
    ctl.paint();
  }
  /** the one button over the cube: blue to connect, green once it is connected */
  function paintConn(){
    const on = !!conn, b = q("btnConn");
    b.textContent = on ? "Connected" : "Connect";
    b.className = "btnConn" + (on ? " on" : " primary");
    b.title = on ? "Connected — press to disconnect" : "Connect this side's cube";
    b.disabled = ghostMode;
  }
  q("btnConn").onclick = async () => {
    if(!conn){ connect(); return; }
    try{ await conn.disconnect(); }catch(e){}
    cleanup("Disconnected");
  };
  q("btnSolved").onclick = async () => {
    if(conn){
      try{ await conn.sendCubeCommand({type:"REQUEST_RESET"}); }
      catch(e){ ctl.msg("Side " + key + ": could not tell the cube it is solved.","err"); return; }
    }
    state = SOLVED; facWarned = false;
    ctl.msg("Side " + key + ": the cube now counts as solved.","ok");
    render();
  };

  applyScheme();
  showTime(0, ""); clearSplits(); applyView(); render();

  return {
    key: key,
    startRound: startRound,
    idle: () => { stopTick(); phase = IDLE; A = {S:[], rem:[]}; result = null; lastShown = null; exactMs = null;
                  showTime(0,""); showMeta(null); showScrTime(""); clearSplits(); render();
                  if(!conn && !ghostMode) setStatus("Not connected",""); },
    phase: () => phase,
    result: () => result,
    connected: () => !!conn,
    deviceId: () => device && device.id,
    solved: () => state === SOLVED,
    verdict: (html) => { verdictText = html; statusLine(); },
    setReady: setReady,
    /* --- for a recorded opponent (ghost) --- */
    ghostReady: (st, label, ms) => {     // the ghost's cube is simply put into place
      stopTick();
      exactMs = (ms == null) ? null : ms;   // and it will finish on its recorded time
      state = st; target = st; recalced = false;
      A = {S: [], rem: []}; result = null; verdictText = "";
      t0 = tCross = tF2L = tOLL = tEnd = 0; nMoves = 0; lastFace = null; lastLen = -1;
      phase = WAIT;
      showText("Wait", "insp"); showScrTime(""); clearSplits(); render();
      setStatus(label || "Ghost Loaded", "on");
      ctl.onScrambled(key);
    },
    /* a recorded solve with no move list: only its time is known */
    fakeResult: (ms, dnf) => {
      stopTick();
      phase = DONE;
      result = dnf ? {dnf:true, ms:null, cross:null, f2l:null, oll:null, pll:null, moves:0, t:Date.now()}
                   : {ms:ms, cross:null, f2l:null, oll:null, pll:null, moves:0, t:Date.now()};
      lastShown = dnf ? {dnf:true} : {ms:ms};
      if(dnf) showText("DNF", "dnf"); else { showTime(ms, "done"); showMeta(null); }
      clearSplits(); render();
      ctl.onDone(key);
    },
    setGhost: (on, label) => {           // a ghost has no cube of its own to set up
      ghostMode = !!on;
      ["btnSolved","btnRecalc","btnGive"].forEach(c => {
        const el = q(c); if(el) el.disabled = ghostMode;
      });
      paintConn();
      setStatus(on ? (label || "Ghost Loaded") : (conn ? "Connected" : "Not connected"),
                on || conn ? "on" : "");
      render();
    },
    redrawTime: () => {          // the digits setting changed
      if(phase === SOLVING) return;                       // the tick will catch up on its own
      if(phase === DONE && result && !result.dnf){ showTime(result.ms, "done"); showMeta(result); }
      else if(phase === SCRAMBLE && lastShown && !lastShown.dnf){ showTime(lastShown.ms, ""); showMeta(lastShown); }
      showSplits();
    },
    recalc: recalc,
    giveUp: giveUp,
    move: doMove,                                  // also used for testing from the console
    seq: () => A.S.slice(),
    state: () => state,
    setSolved: () => { state = SOLVED; render(); },
    label: t => { },                     // the pill it used to write into is gone
    bestOnly: () => q("optBest").checked
  };
}

/* ============================================================
   5. The battle
   ============================================================ */
let scrLen = +LS.get("len","22") || 22;
let round = 0, log = [], lastSeq = null;   // lastSeq: so a round can be played again as it was
/* Single entry: one player on the left, and the right-hand cube replays his own
   best time on this very scramble, so every scramble can be gone at again and again.
   The scrambles are kept in order, and each one keeps its number for good. */
let scrList = [];            // on your own: the scrambles made so far, in order
let ghostSolve = null;       // the recording being raced this round, wherever it came from
const SIDES = {};

const ctl = {
  msg: (t, cls) => { const m = $("msg"); m.textContent = t || ""; m.className = "msg" + (cls ? " " + cls : ""); },
  onStart: k => {
    paintHead();
    if(ghostSolve && k === "A") playGhost();
  },
  onDone: () => roundStep(),
  onScrambled: () => {
    /* Two cubes wait for each other; a lone player (with or without a ghost
       beside him) is ready the moment his own scramble is done. */
    const bIn = SIDES.B.phase() !== IDLE;
    if(SIDES.A.phase() === WAIT && (!bIn || SIDES.B.phase() === WAIT)){
      SIDES.A.setReady(); if(bIn) SIDES.B.setReady();
      ctl.msg(bIn && bHasCube() ? "Both cubes are scrambled — turn to start."
                                : "Scrambled — turn to start.", "ok");
    }
  },
  otherDone: k => { const o = SIDES[k === "A" ? "B" : "A"]; return o && o.phase() === DONE; },
  otherDevice: k => { const o = SIDES[k === "A" ? "B" : "A"]; return o && o.connected() && o.deviceId(); },
  exportSide: k => exportSide(k),
  textSide: k => textReport(k),
  paint: () => paintHead()
};
SIDES.A = makeSide(document.querySelector('.side[data-k="A"]'),
                   document.querySelector('.setside[data-k="A"]'), "A", ctl);
SIDES.B = makeSide(document.querySelector('.side[data-k="B"]'),
                   document.querySelector('.setside[data-k="B"]'), "B", ctl);

/* The ghost is side B's business, so its controls sit with side B: loading a file
   down in B's cube panel, and — once one is loaded — the solve picker and the way
   out up in the row above B's cube. */
(function placeGhostControls(){
  const top = document.querySelector('.side[data-k="B"] .sidetop');
  top.querySelector(".ghostload").appendChild($("btnGhost"));   // Load, just right of B's Connect
  document.querySelector('.side[data-k="B"] .pickrow').appendChild($("selGhostNo"));
  top.appendChild($("btnGhostOff"));
  document.querySelector('.setside[data-k="B"] .ghostslot').appendChild($("selGhostSes"));
  document.querySelector('.setside[data-k="A"] .ghostrow').style.display = "none";
  document.querySelector('.setside[data-k="B"] .ghostrow').style.display = "none";  // until a file is read
})();

/** a round is under way while either cube is still scrambling, waiting or solving */
const inPlay = () => ["A","B"].some(k => {
  const p = SIDES[k].phase(); return p !== IDLE && p !== DONE;
});

/** who took a round: a side that gave up loses it; both giving up is nobody's */
const wonBy = r => !r || !r.a || !r.b ? null
  : (r.a.dnf && r.b.dnf) ? null
  : r.a.dnf ? "B" : r.b.dnf ? "A"
  : r.a.ms < r.b.ms ? "A" : r.b.ms < r.a.ms ? "B" : null;
/* ---- what a round is called ----
   Ordinary rounds simply count up. Against a ghost, a round takes the number of
   the recorded solve it is run against, so round 2 is always the ghost's second
   solve; going at that same solve more than once makes them 2-1, 2-2, 2-3 …   */
const sameGhost = (r, g, gn) => r && r.g === g && r.gn === gn;
/* which numbered scramble is up: a recorded solve in ghost mode, one of this
   session's own scrambles in single entry, and nothing with two cubes */
const SOLO = "#solo";
const curNo = () => curScr;
const curGn = () => curScrGn;
function ghostTries(g, gn){
  let c = 0;
  for(const r of log) if(sameGhost(r, g, gn)) c++;
  if(inPlay() && curNo() === g && curGn() === gn) c++;
  return c;
}
/** the label of the round kept at log[i] */
function roundLabel(i){
  const r = log[i]; if(!r) return String(i + 1);
  if(r.g == null){                                   // no ghost: count the plain rounds
    let c = 0;
    for(let j = 0; j <= i; j++) if(log[j].g == null) c++;
    return String(c);
  }
  if(ghostTries(r.g, r.gn) < 2) return String(r.g);
  let n = 0;
  for(let j = 0; j <= i; j++) if(sameGhost(log[j], r.g, r.gn)) n++;
  return r.g + "-" + n;
}
/** the label of the round being played right now (it is not in the log yet) */
function curLabel(){
  if(curNo()){
    const g = curNo(), gn = curGn();
    let c = 0;
    for(const r of log) if(sameGhost(r, g, gn)) c++;
    return c ? g + "-" + (c + 1) : String(g);
  }
  let c = 0;
  for(const r of log) if(r.g == null) c++;
  return String(c + 1);
}
function wins(){
  let a = 0, b = 0;
  for(const r of log){ const w = wonBy(r); if(w === "A") a++; else if(w === "B") b++; }
  return {a:a, b:b};
}
function totals(){
  const s = k => log.reduce((t,r) => t + ((r[k] && r[k].ms) || 0), 0);
  return {a: s("a"), b: s("b")};
}
function paintHead(){
  const busy = inPlay();
  /* the same button all through: it brings the next scramble up, and while a
     round is on it is the way to drop that round instead */
  /* what the button offers depends on who is entered: nothing without a cube on
     the left, a lone run with only A, a battle once B has a cube or a ghost */
  const ready = aHasCube(), two = bHasCube() || !!ghost;
  $("btnBattle").disabled = !busy && !ready;
  const first = !log.length && !lastSeq;        // after the first round it is just the next scramble
  $("btnBattle").textContent = busy ? "RESET" : !ready ? "START"
                             : !first ? "NEW SCRAMBLE" : two ? "BATTLE" : "SINGLE";
  $("btnBattle").className = "battle" + (busy ? " rst" : "");
  $("btnBattle").title = busy ? "Stop this round. The times already taken are kept."
    : !ready ? "Connect side A's cube first"
    : two ? "Bring up a scramble for both sides" : "Bring up a scramble for yourself";
  $("btnAgain").disabled = busy || !lastSeq;
  paintGhostNo();
}

/* ---- the middle column ----
   the standings on top, then the last few rounds with the newest first */
const SHOW_N = 5;
const msOf = res => !res ? null : res.dnf ? Infinity : res.ms;
function meanOf(k){
  const v = log.map(r => msOf(r[k])).filter(x => x != null && isFinite(x));
  return v.length ? v.reduce((t,x) => t + x, 0) / v.length : null;
}
/** the usual cubing average of the last n: best and worst dropped, a DNF counts as the worst */
function aoOf(k, n){
  const list = log.filter(r => r[k]);          // rounds this side actually took part in
  if(list.length < n) return null;
  const v = list.slice(-n).map(r => msOf(r[k])).sort((x,y) => x - y).slice(1, -1);
  if(v.some(x => x == null || !isFinite(x))) return Infinity;    // more than one DNF in the window
  return v.reduce((t,x) => t + x, 0) / v.length;
}
function paintTimes(){
  const w = wins();
  const num = v => v == null ? "—" : (v === Infinity ? "DNF" : fmt(v));
  const line = (lab, a, b, cls) =>
    `<div class="trow ${cls || ""}"><span class="n">${lab}</span>`
    + `<span class="ta">${a}</span><span class="tb">${b}</span></div>`;
  $("timesHead").innerHTML =
      line("Wins", w.a, w.b, "big")
    + line("Mean", num(meanOf("a")), num(meanOf("b")), "small")
    + line("Ao5",  num(aoOf("a", 5)),  num(aoOf("b", 5)),  "small")
    + line("Ao10", num(aoOf("a", 10)), num(aoOf("b", 10)), "small");

  const cell = (res, cls) => !res ? `<span class="${cls} none">—</span>`
    : res.dnf ? `<span class="${cls} dnf">DNF</span>`
    : `<span class="${cls}">${fmt(res.ms)}<span class="mv">/ ${res.moves || 0}</span></span>`;
  let html = "";
  if(inPlay())                                   // the round being played, at the very top
    html += `<div class="trow cur"><span class="n">${curLabel()}</span>`
          + `<span class="ta none">—</span><span class="tb none">—</span></div>`;
  const stop = Math.max(0, log.length - SHOW_N);
  for(let i = log.length - 1; i >= stop; i--){
    const r = log[i], won = wonBy(r);
    html += `<div class="trow">`
          + `<span class="n del" data-i="${i}" title="Click the number to delete this round (both times)">${roundLabel(i)}</span>`
          + cell(r.a, "ta" + (won === "A" ? " win" : ""))
          + cell(r.b, "tb" + (won === "B" ? " win" : ""))
          + "</div>";
  }
  if(!html) html = '<div class="empty">No rounds yet.</div>';
  $("timesBody").innerHTML = html;
  $("timesBody").querySelectorAll(".n.del").forEach(el =>
    el.onclick = () => deleteRound(+el.dataset.i));
}
/** turns per second over every solve that finished */
function avgTps(k){
  const v = log.map(r => r[k]).filter(r => r && !r.dnf && r.ms && r.moves);
  if(!v.length) return "—";
  const mv = v.reduce((t,r) => t + r.moves, 0), ms = v.reduce((t,r) => t + r.ms, 0);
  return (mv / (ms/1000)).toFixed(2);
}
/* ---- the order of the Rounds table ----
   By number, highest first, so 4-3 4-2 4-1 sit together under 5; or by time, and
   either way the order can be turned round. */
let sortBy = "no", sortAsc = false;
function labelParts(i){
  const m = /^(\d+)(?:-(\d+))?$/.exec(roundLabel(i));
  return m ? [+m[1], +(m[2] || 0)] : [0, 0];
}
function sortedRounds(){
  const idx = log.map((r,i) => i);
  const timeOf = i => { const a = log[i].a; return (a && !a.dnf && a.ms) ? a.ms : Infinity; };
  idx.sort((x,y) => {
    let d;
    if(sortBy === "time") d = timeOf(x) - timeOf(y) || x - y;
    else { const px = labelParts(x), py = labelParts(y); d = px[0] - py[0] || px[1] - py[1] || x - y; }
    return sortAsc ? d : -d;
  });
  return idx;
}
function paintSort(){
  $("btnSortKey").textContent = sortBy === "time" ? "Sort by number" : "Sort by time";
  $("sortnote").textContent = sortBy === "time"
    ? (sortAsc ? "by time, fastest first" : "by time, slowest first")
    : (sortAsc ? "by number, oldest first" : "by number, newest first");
}
$("btnSortKey").onclick = () => {
  sortBy = sortBy === "time" ? "no" : "time";
  sortAsc = sortBy === "time";            // fastest first, or the newest number first
  paintSort(); paintResults();
};
$("btnSortDir").onclick = () => { sortAsc = !sortAsc; paintSort(); paintResults(); };
function paintResults(){
  if(!log.length){ $("resWrap").innerHTML = '<div class="empty">No rounds yet.</div>'; return; }
  const sp = r => (r && !r.dnf) ? `${fmt(r.cross)} / ${fmt(r.f2l)} / ${fmt(r.oll)} / ${fmt(r.pll)}` : "";
  /* the time on its own, then the two numbers that belong together */
  const cell = res => !res ? "—" : res.dnf ? "DNF" : fmt(res.ms);
  const mvtps = res => (res && !res.dnf && res.ms && res.moves)
    ? `${res.moves} / ${(res.moves / (res.ms/1000)).toFixed(2)}` : "—";
  const rows = sortedRounds().map(i => {
    const r = log[i], w = wonBy(r);
    return `<tr><td class="del" data-i="${i}" title="Click the number to delete this round (both times)">${roundLabel(i)}</td>`
         + `<td class="${w === "A" ? "win" : ""}">${cell(r.a)}</td><td>${mvtps(r.a)}</td><td class="sp">${sp(r.a)}</td>`
         + `<td class="${w === "B" ? "win" : ""}">${cell(r.b)}</td><td>${mvtps(r.b)}</td><td class="sp">${sp(r.b)}</td>`
         + `<td>${w || "—"}</td></tr>`;
  }).join("");
  /* the top row holds averages: totals of a practice session say very little */
  const w = wins();
  const done = k => log.map(r => r[k]).filter(r => r && !r.dnf && r.ms);
  const mean = (list, f) => list.length ? list.reduce((t,x) => t + f(x), 0) / list.length : null;
  const avTime = k => { const v = done(k); return v.length ? fmt(mean(v, r => r.ms)) : "—"; };
  const avMv = k => { const v = done(k); return v.length ? (mean(v, r => r.moves || 0)).toFixed(1) : "—"; };
  const avSp = k => { const v = done(k); return v.length
      ? ["cross","f2l","oll","pll"].map(f => fmt(mean(v, r => r[f] || 0))).join(" / ") : ""; };
  $("resWrap").innerHTML = `<table>
    <thead><tr><th>Round</th><th>A — time</th><th>A — moves / TPS</th><th>A — cross / F2L / OLL / PLL</th>
      <th>B — time</th><th>B — moves / TPS</th><th>B — cross / F2L / OLL / PLL</th><th>Won</th></tr></thead>
    <tbody><tr class="tot"><td>Average (${log.length})</td><td>${avTime("a")}</td><td>${avMv("a")} / ${avgTps("a")}</td><td class="sp">${avSp("a")}</td>
      <td>${avTime("b")}</td><td>${avMv("b")} / ${avgTps("b")}</td><td class="sp">${avSp("b")}</td><td>${w.a} — ${w.b}</td></tr>
      ${rows}</tbody></table>`;
  $("resWrap").querySelectorAll("td.del").forEach(el =>    // the whole log is here, so old rounds can go from this table
    el.onclick = () => deleteRound(+el.dataset.i));
}
/* ---- the shape of a round ----
   Side B joins in when it has a cube of its own or a recording to replay. With
   nobody on the right it is a single entry: then the scrambles are numbered, so
   any of them can be gone at again — against the best time on it so far. */
let aForce = false, bForce = false;          // testing only: pretend a cube is on that side
const aHasCube = () => aForce || SIDES.A.connected();
const bHasCube = () => !ghost && (bForce || SIDES.B.connected());   // a loaded ghost takes B's place
const isSolo = () => !ghost && !bHasCube();
let curScr = 0, curScrGn = null;             // the numbered scramble up now (0 = a plain round)

function startRound(seq, rec, no, gn){
  round = log.length + 1;
  lastSeq = seq.slice();
  curScr = no || 0; curScrGn = no ? gn : null;
  stopGhost();
  ghostSolve = rec || null;
  SIDES.A.startRound(seq);
  if(rec){
    const target = seq.reduce((st,m) => applyMove(st,m), SOLVED);
    SIDES.B.ghostReady(target, (rec.mine ? "Your best " : "Ghost ") + fmt(rec.ms),
                       rec.dnf ? null : rec.ms);
  } else if(bHasCube()){
    SIDES.B.startRound(seq);
  } else {
    SIDES.B.idle();                          // nothing to race yet: the right-hand side sits this one out
    SIDES.B.label("No time on this scramble yet");
  }
  saveSession();                             // the numbering survives a reload too
  paintHead(); paintTimes();
  $("btnAgain").disabled = true;
  const lab = curLabel();
  const go = lab.indexOf("-") > 0 ? lab.split("-")[1] : 1;
  ctl.msg(!no
    ? `Round ${lab}: turn the scramble. It says Wait until the other side is done too, then Ready.`
    : rec
      ? `Scramble ${no}, go ${go}: turn it, then beat `
        + (rec.mine ? "your own " : "the ") + fmt(rec.ms) + " s."
      : `Scramble ${no}: turn it and go. Same Scramble afterwards puts your own best beside you.`);
}
/* ---- the numbered scrambles ----
   In ghost mode they are the solves of the file that was read; on your own they
   are the ones this session has made. Either way number 2 always means the same
   scramble, and the time to beat on it is the best there is — the recording, or
   your own once you have bettered it. */
const listLen = () => ghost ? ghost.solves.length : scrList.length;
const gnOf    = () => ghost ? ghost.name : SOLO;
const scrOf   = n => ghost ? (ghost.solves[n-1] && ghost.solves[n-1].scr) : scrList[n-1];
/** the player's own best go at scramble n */
function myBest(n){
  let best = null;
  for(const r of log){
    if(!sameGhost(r, n, gnOf())) continue;
    const a = r.a;
    if(!a || a.dnf || !a.ms) continue;
    if(!best || a.ms < best.ms) best = a;
  }
  return best;
}
/** what the right-hand cube replays on scramble n */
function bestFor(n){
  const rec = ghost ? ghost.solves[n-1] : null;
  const mine = myBest(n);
  if(mine && (!rec || rec.dnf || mine.ms < rec.ms))
    return {dnf: false, ms: mine.ms, mine: true, src: mine,
            scr: (scrOf(n) || []).slice(),
            moves: (mine.mvRaw && mine.mvRaw.length)
                   ? mine.mvRaw.map(e => ({m: e[0], t: e[1]})) : null};
  return rec;
}
function startNumbered(n){
  const seq = scrOf(n); if(!seq) return;
  if(ghost) ghost.idx = n;
  startRound(seq.slice(), bestFor(n), n, gnOf());
}
function nextRound(){
  if(ghost){
    const n = nextGhostNo();             // the lowest-numbered solve that has not been raced yet
    if(!n){ ctl.msg("Every recorded solve has been raced. Pick a number to go at one of them again, "
                  + "or load another file.", "err"); return; }
    startNumbered(n);
    return;
  }
  if(bHasCube()){                        // two cubes: one scramble, both sides, as before
    startRound(makeScramble(scrLen));
    return;
  }
  scrList.push(makeScramble(scrLen));    // on your own: a new scramble with a number of its own
  startNumbered(scrList.length);
}
const ghostPlayed = n => log.some(r => sameGhost(r, n, gnOf()));
function nextGhostNo(){
  if(!ghost) return 0;
  for(let i = 1; i <= ghost.solves.length; i++) if(!ghostPlayed(i)) return i;
  return 0;
}
let ghostNoSig = "";
function paintGhostNo(){
  const sel = $("selGhostNo");
  if(!listLen() || (!ghost && bHasCube())){ sel.style.display = "none"; ghostNoSig = ""; return; }
  sel.style.display = "";
  const bests = Array.from({length: listLen()}, (_,i) => bestFor(i+1));
  const sig = gnOf() + "|" + listLen() + "|"
            + bests.map((b,i) => (b ? (b.mine ? "m" : "r") + Math.round(b.ms) : "0")
                                 + (ghostPlayed(i+1) ? "*" : "")).join(",");
  if(sig !== ghostNoSig){                // only rebuilt when something actually changed
    ghostNoSig = sig;
    sel.innerHTML = bests.map((b,i) => {
      const n = i + 1, tick = ghostPlayed(n) ? " \u2713" : "";
      return `<option value="${n}">${n} — `
           + (!b ? "no time" : (b.mine ? "best " : "") + (b.dnf ? "DNF" : fmt(b.ms)))
           + tick + "</option>";
    }).join("");
  }
  sel.value = String(curScr || nextGhostNo() || 1);
  sel.disabled = inPlay();
}
$("selGhostNo").onchange = () => {
  if(inPlay()){ paintGhostNo(); return; }
  startNumbered(+$("selGhostNo").value);
};
/** play the very same round again — same scramble, and the same recorded solve */
function againRound(){
  if(!lastSeq) return;
  if(curScr){ startNumbered(curScr); return; }  // the same scramble, with the best time on it beside you
  startRound(lastSeq.slice());
}
/* A round has to end with both cubes in the same state. If a cube is not solved
   — after a give up, say — the engine works out a scramble from where it is, so
   there is nothing to wait for. Only if the engine is not ready yet does the app
   wait for the cubes to be solved by hand. */
let waitTimer = null;
function whenBothSolved(fn){
  if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
  const notSolved = () => ["A","B"].filter(k => !SIDES[k].solved() && !(k === "B" && !bHasCube()));
  const go = () => {
    if(!solverReady && notSolved().length) return false;
    if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
    fn(); return true;
  };
  if(go()) return;
  ctl.msg("Side " + notSolved().join(" and ") + ": solve the cube (or press “Reset cube”), "
        + "or wait a moment for the engine to be ready.", "warn");
  waitTimer = setInterval(go, 400);
}
function roundStep(){
  paintHead();
  const bIn = SIDES.B.phase() !== IDLE;        // single entry with no ghost: B sits this one out
  if(SIDES.A.phase() !== DONE) return;
  if(bIn && SIDES.B.phase() !== DONE) return;
  if(log.length >= round) return;              // this round has been counted already
  const a = SIDES.A.result(), b = bIn ? SIDES.B.result() : null;
  if(!a || (bIn && !b)) return;
  const lab = curLabel();                      // worked out before the round joins the log
  log.push({a:a, b:b,
            g: curNo() || null,                // which numbered scramble this round belongs to
            gn: curNo() ? curGn() : null});
  saveSession();
  paintResults(); paintTimes(); paintHead();
  const w0 = wonBy(log[log.length-1]);
  const gap = (!b || a.dnf || b.dnf) ? null : Math.abs(a.ms - b.ms);
  const say = (k, won) => SIDES[k].verdict(won === null
      ? '<span style="color:var(--warn)">' + (a.dnf && b.dnf ? "Both gave up" : "Dead heat") + '</span>'
      : won ? '<span style="color:var(--ok)">Won this round' + (gap == null ? "" : " by " + fmt(gap) + " s") + '</span>'
            : '<span style="color:var(--muted)">Lost' + (gap == null ? "" : " by " + fmt(gap) + " s") + '</span>');
  if(b){
    say("A", w0 === null ? null : w0 === "A");
    say("B", w0 === null ? null : w0 === "B");
  }
  if(curScr && !bHasCube()){
    const now = bestFor(curScr);               // the time to beat from here on
    ctl.msg(a.dnf ? `Scramble ${curScr}: gave up. Same Scramble to try it again.`
      : !b ? `Scramble ${curScr}: ${fmt(a.ms)} s — the first time on it. `
             + "Same Scramble puts that time beside you as a ghost."
      : (w0 === "A" ? `Scramble ${curScr}: ${fmt(a.ms)} s — a new best on it.`
                    : `Scramble ${curScr}: ${fmt(a.ms)} s. The time to beat is still `
                      + fmt(now ? now.ms : a.ms) + " s."), "ok");
    return;
  }
  const w = wins();
  ctl.msg((w0 === null ? `Round ${lab} went to nobody.` : `Round ${lab} to ${w0}.`)
        + `  A ${w.a} — ${w.b} B.  Press New Scramble.`, "ok");
}
/* ============================================================
   Racing a recorded opponent (a "ghost")
   A csTimer file is read, and one of its solves becomes the right-hand player:
   the same scramble is set for both, and once this side starts turning, the
   ghost's cube replays its own moves at the times they were recorded.
   ============================================================ */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
let ghost = null;            // {name, solves, idx, cur}
let ghostTimers = [];
function stopGhost(){ ghostTimers.forEach(clearTimeout); ghostTimers = []; }

/** "U@0 L'@126 …" → [{m:"U", t:0}, …] */
function parseGhostMoves(str){
  const out = [];
  for(const part of String(str).trim().split(/\s+/)){
    const m = /^([URFDLB]['2]?)@(\d+)$/.exec(part);
    if(!m) return null;
    if(!MV[m[1]]) return null;
    out.push({m:m[1], t:+m[2]});
  }
  return out.length ? out : null;
}
const scrambleTokens = str => {
  const out = [];
  for(const t of String(str).trim().split(/\s+/)){
    if(!t) continue;
    if(!MV[t]) return null;                      // rotations or wide moves: not for us
    out.push(t);
  }
  return out;
};
/** csTimer's own file: one array per session, each solve [[pen,ms], scramble, …] */
function parseCsTimer(text){
  const d = JSON.parse(text);
  let sd = {};
  try{ sd = JSON.parse((d.properties && d.properties.sessionData) || "{}"); }catch(e){ sd = {}; }
  const out = [];
  Object.keys(d).filter(k => /^session\d+$/.test(k)).forEach(k => {
    const idx = k.slice(7);
    const rows = (d[k] || []).slice();           // every row, kept as it was written
    const solves = [];
    rows.forEach((r, ri) => {
      if(!Array.isArray(r) || !Array.isArray(r[0])) return;
      const scr = scrambleTokens(r[1] || "");
      if(!scr || !scr.length) return;            // without a scramble there is nothing to match
      const pen = r[0][0], ms = r[0][1];
      solves.push({
        dnf: pen === -1,
        ms: pen === 2000 ? ms + 2000 : ms,
        scr: scr,
        ri: ri,                                  // where this solve sits in the original file
        moves: (r.length > 4 && r[4] && r[4][0]) ? parseGhostMoves(r[4][0]) : null
      });
    });
    if(solves.length) out.push({name: (sd[idx] && sd[idx].name) || k, solves: solves, rows: rows});
  });
  return out;
}
let ghostFile = [];
$("btnGhost").onclick = () => $("fileGhost").click();
$("fileGhost").onchange = e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let sessions = [];
    try{ sessions = parseCsTimer(String(rd.result)); }
    catch(err){ ctl.msg("That file could not be read as a csTimer export.", "err"); return; }
    if(!sessions.length){ ctl.msg("No usable solves in that file (each one needs a scramble).", "err"); return; }
    ghostFile = sessions;
    $("selGhostSes").innerHTML = sessions.map((s,i) =>
      `<option value="${i}">${esc(s.name)} (${s.solves.length})</option>`).join("");
    $("selGhostSes").style.display = "";
    $("btnGhostOff").style.display = "";
    document.querySelector('.setside[data-k="B"] .ghostrow').style.display = "";
    useGhost(0);
  };
  rd.readAsText(f);
  e.target.value = "";
};
function useGhost(i){
  const ses = ghostFile[i]; if(!ses) return;
  stopGhost();
  ghost = {name: ses.name, solves: ses.solves, rows: ses.rows, idx: 0, cur: null, curNo: 0};
  ghostNoSig = "";
  SIDES.B.setGhost(true);
  SIDES.A.idle(); SIDES.B.idle();
  document.querySelector('.setside[data-k="B"] .ghostinfo').textContent =
    ses.name + " — " + ses.solves.length + " solve(s)";
  paintHead(); paintTimes();
  ctl.msg(`Ghost loaded: “${ses.name}”, ${ses.solves.length} solve(s). Press the big button for the first one `
        + "still to be raced, or pick a number yourself — you are on the left.", "ok");
}
$("selGhostSes").onchange = () => useGhost(+$("selGhostSes").value);
function leaveGhost(quiet){
  stopGhost(); ghost = null; ghostSolve = null; ghostNoSig = "";
  SIDES.B.setGhost(false);
  SIDES.A.idle(); SIDES.B.idle();
  $("selGhostSes").style.display = "none";
  $("btnGhostOff").style.display = "none";
  document.querySelector('.setside[data-k="B"] .ghostrow').style.display = "none";
  document.querySelector('.setside[data-k="B"] .ghostinfo').textContent = "";
  paintHead(); paintTimes();
  if(!quiet) ctl.msg("Back to two cubes.");
}
$("btnGhostOff").onclick = () => leaveGhost();


/* ---- csTimer export, one player at a time ----
   csTimer reads a JSON file holding one array per session. A solve is
     [[penalty, milliseconds], scramble, comment, unix seconds, [moves, "333"]]
   The scramble is worked out backwards from the state the solve began in, so it
   reproduces that state from a solved cube — which is what csTimer assumes. */
function csTimerSolve(res){
  const scr = res.st0 ? pathBetween(SOLVED, res.st0) : [];
  const e = [ res.dnf ? [-1, 0] : [0, Math.round(res.ms)],
              scr ? scr.join(" ") : "",
              res.dnf ? "gave up"
                      : `cross ${fmt(res.cross)} / F2L ${fmt(res.f2l)} / OLL ${fmt(res.oll)} / PLL ${fmt(res.pll)}`,
              Math.round(((res.t || Date.now()) - (res.ms || 0)) / 1000) ];
  if(res.mv) e.push([res.mv, "333"]);
  return e;
}
function saveFile(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/plain"}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const stamp = () => { const d = new Date(), p = n => (n<10?"0":"") + n;
  return "" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
       + "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); };
/** Rounds worth writing out. Several goes at the same recorded solve share one
    scramble, so only the best of them is kept — judged by the live player on the
    left, since the ghost replays the very same time every go. Plain rounds all stay. */
function exportRounds(){
  const best = new Map();
  log.forEach((r, i) => {
    if(r.g == null) return;
    const key = r.gn + "#" + r.g;
    const rank = x => (x && x.a && !x.a.dnf && x.a.ms) ? x.a.ms : Infinity;
    const cur = best.get(key);
    if(cur == null || rank(r) < rank(log[cur])) best.set(key, i);
  });
  return log.filter((r, i) => r.g == null || best.get(r.gn + "#" + r.g) === i);
}
/** one move list as csTimer writes it: "U@0 L'@126 …", doubles as two quarter turns */
const mvLineOf = list => list.map(e => {
  const t = e[0], ms = e[1];
  return t.endsWith("2") ? (t[0] + "@" + ms + " " + t[0] + "@" + ms) : (t + "@" + ms);
}).join(" ");

/* ---- writing a ghost file back out ----
   The file that was read is the base. Where the player has bettered one of its
   solves, that row is replaced by his own — same scramble text, his time and his
   moves. Every other row, raced or not, goes out exactly as it came in. */
function exportGhostFile(){
  const rows = (ghost.rows || []).slice();
  let n = 0;
  ghost.solves.forEach((s, i) => {
    const mine = myBest(i + 1);
    if(!mine) return;
    if(!s.dnf && mine.ms >= s.ms) return;        // the recording still holds
    const orig = rows[s.ri] || [];
    const e = [[0, Math.round(mine.ms)], orig[1] || "",
               "Cube Timer — beat " + (s.dnf ? "a DNF" : fmt(s.ms) + " s"),
               Math.round(((mine.t || Date.now()) - (mine.ms || 0)) / 1000)];
    if(mine.mvRaw && mine.mvRaw.length) e.push([mvLineOf(mine.mvRaw), "333"]);
    rows[s.ri] = e;
    n++;
  });
  const out = {session1: rows,
               properties: {sessionData: JSON.stringify({1:{name: ghost.name, opt:{}, rank:1}}),
                            sessionN: 1, session: 1}};
  saveFile("cstimer_" + ghost.name.replace(/[^\w\-]+/g, "_") + "_" + stamp() + ".txt", JSON.stringify(out));
  ctl.msg(n ? `Ghost file written out with ${n} of its solve(s) replaced by your better times `
            + `(${rows.length - n} left as they were).`
            : "Ghost file written out unchanged — none of its times have been bettered yet.", "ok");
}
function exportSide(k){
  if(ghost && k === "A"){ exportGhostFile(); return; }
  /* every go is written out, the several tries at one scramble included, unless
     “Only best score” is ticked — then one scramble leaves one solve behind */
  const kept = SIDES[k].bestOnly() ? exportRounds() : log.slice();
  const dropped = log.length - kept.length;
  const list = kept.map(r => r[k === "A" ? "a" : "b"]).filter(Boolean);
  if(!list.length){ ctl.msg("Side " + k + " has no times to export yet.", "err"); return; }
  if(!solverInit()){ ctl.msg("The engine is not ready yet — try again in a moment.", "err"); return; }
  const out = {};
  out.session1 = list.map(csTimerSolve);
  out.properties = {sessionData: JSON.stringify({1:{name:"Cube Timer " + k, opt:{}, rank:1}}),
                    sessionN: 1, session: 1};
  saveFile("cstimer_" + k + "_" + stamp() + ".txt", JSON.stringify(out));
  ctl.msg("Side " + k + ": " + list.length + " solve(s) written for csTimer."
        + (dropped ? "  " + dropped + " slower go(es) at a scramble already in the file were left out." : ""), "ok");
}

/* ---- the plain-text round sheet ----
   One player at a time, and not meant to be read back in by anything: it is for
   keeping, or for showing someone how a session went. Every scramble is written
   in the standard orientation — white on top, green in front — however the cube
   was held while it was turned. */
function textReport(k){
  const key = k === "B" ? "b" : "a";
  const mine = log.map((r,i) => ({lab: roundLabel(i), res: r[key]})).filter(x => x.res);
  if(!mine.length){ ctl.msg("Side " + k + " has no rounds to write out yet.", "err"); return; }
  if(!solverInit()){ ctl.msg("The engine is not ready yet — try again in a moment.", "err"); return; }
  const t2 = ms => (ms == null) ? "-" : (ms/1000).toFixed(prec);
  const scrOfRes = res => {
    if(!res || !res.st0) return "";
    const path = pathBetween(SOLVED, res.st0);
    return path ? path.join(" ") : "";
  };
  const W = {n: 6, t: 9, mv: 6, tps: 7, sp: 24};
  /* the four splits read as one group, so no spaces inside it — the whole group
     is padded instead, which keeps the scrambles under each other */
  const splits = res => (res.dnf ? ["-","-","-","-"] : [res.cross, res.f2l, res.oll, res.pll].map(t2))
                          .join("/").padEnd(W.sp);
  const row = x => {
    const res = x.res;
    const tps = (!res.dnf && res.ms && res.moves) ? (res.moves/(res.ms/1000)).toFixed(2) : "-";
    return [String(x.lab).padEnd(W.n),
            (res.dnf ? "DNF" : t2(res.ms)).padStart(W.t),
            String(res.dnf ? "-" : (res.moves || 0)).padStart(W.mv),
            tps.padStart(W.tps),
            splits(res),
            "  " + scrOfRes(res)].join(" ").replace(/\s+$/, "");
  };
  const head = ["#".padEnd(W.n), "time".padStart(W.t), "moves".padStart(W.mv), "TPS".padStart(W.tps),
                "cross/F2L/OLL/PLL".padEnd(W.sp), "  scramble"].join(" ");
  const v = mine.filter(x => !x.res.dnf && x.res.ms).map(x => x.res.ms);
  const dnf = mine.filter(x => x.res.dnf).length;
  const d = new Date(), p2 = n => (n<10?"0":"") + n;
  const lines = ["Cube Timer — player " + k + " — "
                 + d.getFullYear() + "-" + p2(d.getMonth()+1) + "-" + p2(d.getDate())
                 + " " + p2(d.getHours()) + ":" + p2(d.getMinutes())];
  if(v.length) lines.push(v.length + " solve(s), mean " + t2(v.reduce((t,x) => t+x, 0)/v.length)
                          + ", best " + t2(Math.min.apply(null, v))
                          + (dnf ? ", " + dnf + " gave up" : ""));
  lines.push("Scrambles are written with white on top and green in front.");
  const body = mine.map(row);
  lines.push("", head, "-".repeat(Math.max.apply(null, body.concat(head).map(x => x.length))));
  lines.push.apply(lines, body);
  lines.push("");
  saveFile("cubetimer_" + k + "_" + stamp() + ".txt", lines.join("\n"));
  ctl.msg("Side " + k + ": " + mine.length + " round(s) written out as text.", "ok");
}

/** Replay the ghost's solve, move by move, at the times it was recorded */
function playGhost(){
  stopGhost();
  const s = ghostSolve; if(!s) return;
  if(s.moves && s.moves.length && !s.dnf){
    for(const mv of s.moves)
      ghostTimers.push(setTimeout(() => { if(SIDES.B.phase() !== DONE) SIDES.B.move(mv.m); }, mv.t));
  } else {
    // nothing but a time was recorded, so the ghost simply stops the clock at it
    ghostTimers.push(setTimeout(() => SIDES.B.fakeResult(s.ms, s.dnf), Math.max(0, s.ms || 0)));
  }
}

/** Wipe one round. Both sides' times go together — a single time is never removed. */
function deleteRound(i){
  const r = log[i]; if(!r) return;
  const lab = roundLabel(i);
  const shown = res => !res ? "—" : res.dnf ? "DNF" : fmt(res.ms) + " s";
  if(!confirm(`Delete round ${lab} (A ${shown(r.a)} / B ${shown(r.b)})?\n`
            + "Both times go together and the round is counted as never played.")) return;
  log.splice(i, 1);
  round = log.length + (inPlay() ? 1 : 0);
  saveSession();
  paintResults(); paintTimes(); paintHead();
  ctl.msg(`Round ${lab} deleted.`, "ok");
}
$("btnBattle").onclick = () => {
  if(inPlay()){ resetRound(); return; }      // while a round is on, the button resets it
  const notSolved = ["A","B"].filter(k => !SIDES[k].solved() && !(k === "B" && !bHasCube()));
  if(notSolved.length && !solverInit()){
    ctl.msg("Side " + notSolved.join(" and ") + ": the cube is not solved. Solve it and press “Reset cube”, "
          + "or wait a moment for the engine to be ready.", "err");
    return;
  }
  whenBothSolved(nextRound);
};
$("btnAgain").onclick = () => { if(!inPlay()) againRound(); };

/* ---- a scramble of your own ----
   Written the way the app writes them out: face letters apart with spaces, and
   ' or 2 after a letter. Whole-cube rotations and wide moves are not taken. */
function openSet(on){
  $("setbox").style.display = on ? "" : "none";
  $("btnSet").textContent = on ? "Set Scramble — close" : "Set Scramble";
  if(on){ $("scrIn").focus(); $("scrIn").select(); }
}
$("btnSet").onclick = () => openSet($("setbox").style.display === "none");
$("btnSetNo").onclick = () => openSet(false);
$("scrIn").onkeydown = e => { if(e.key === "Enter") $("btnSetGo").click(); };
$("btnSetGo").onclick = () => {
  if(inPlay()){ ctl.msg("A round is under way — press RESET first.", "err"); return; }
  const seq = scrambleTokens($("scrIn").value || "");
  if(!seq || !seq.length){
    ctl.msg("That scramble could not be read. Write it as U R F D L B with ' or 2, "
          + "spaces between (for example: R U2 R' F). Rotations and wide moves are not taken.", "err");
    return;
  }
  if(!aHasCube()){ ctl.msg("Connect side A's cube first.", "err"); return; }
  openSet(false);
  if(bHasCube()){ startRound(seq); return; }      // two cubes: a plain round
  scrList.push(seq.slice());                      // on your own it becomes the next numbered scramble
  startNumbered(scrList.length);
};

/* ---- keeping a session ----
   Everything is kept in this browser as it is played, so closing the page and
   coming back later carries on where it left off. Save session writes the same
   thing out as a file, for another machine or for keeping. */
const SAVE_KEY = "cb.session";
const sessionData = () => ({v: 1, t: Date.now(), log: log, scrList: scrList,
                            curScr: curScr, curScrGn: curScrGn});
function saveSession(){
  const trim = n => {                 // if it will not fit, the oldest move lists go first
    const copy = JSON.parse(JSON.stringify(sessionData()));
    for(let i = 0; i < Math.min(n, copy.log.length); i++)
      ["a","b"].forEach(k => { if(copy.log[i][k]){ delete copy.log[i][k].mvRaw; delete copy.log[i][k].mv; } });
    return JSON.stringify(copy);
  };
  const tries = [() => JSON.stringify(sessionData()), () => trim(Math.ceil(log.length/2)), () => trim(log.length)];
  for(const make of tries){
    try{ localStorage.setItem(SAVE_KEY, make()); return true; }catch(e){}
  }
  return false;
}
function applySession(d, where){
  if(!d || !Array.isArray(d.log)){ ctl.msg("That file is not a saved session.", "err"); return false; }
  log = d.log;
  scrList = (d.scrList || []).map(x => x.slice());
  curScr = d.curScr || 0; curScrGn = d.curScrGn || null;
  round = log.length; lastSeq = curScr ? (scrOf(curScr) || null) : null;
  ghostNoSig = "";
  paintHead(); paintTimes(); paintResults();
  ctl.msg(log.length + " round(s) loaded from " + where + ". Reset ALL clears them.", "ok");
  return true;
}
$("btnSave").onclick = () => {
  if(!log.length){ ctl.msg("There is nothing to save yet.", "err"); return; }
  saveFile("cubetimer_session_" + stamp() + ".json", JSON.stringify(sessionData()));
  ctl.msg("Session written out (" + log.length + " round(s)).", "ok");
};
$("btnLoad").onclick = () => $("fileSess").click();
$("fileSess").onchange = e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if(!f) return;
  if(log.length && !confirm("Load this session?\nThe " + log.length + " round(s) on screen will be replaced.")) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try{ d = JSON.parse(String(rd.result)); }catch(err){ ctl.msg("That file could not be read.", "err"); return; }
    if(applySession(d, "the file")) saveSession();
  };
  rd.readAsText(f);
};
function resetRound(){
  if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
  stopGhost();
  SIDES.A.idle(); SIDES.B.idle();
  paintHead(); paintTimes();
  ctl.msg("Round reset. The times already taken are kept — press the big button for a new scramble.");
};
/** Throw everything away and start from nothing */
$("btnReset").onclick = () => {
  if(log.length && !confirm(`Delete all ${log.length} round(s) and start again?\nThis cannot be undone.`)) return;
  if(waitTimer){ clearInterval(waitTimer); waitTimer = null; }
  stopGhost(); ghostSolve = null;
  if(ghost) ghost.idx = 0;
  log = []; round = 0;
  scrList = []; curScr = 0; curScrGn = null; lastSeq = null; ghostNoSig = "";   // the numbering starts over too
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  SIDES.A.idle(); SIDES.B.idle();
  paintHead(); paintTimes(); paintResults();
  ctl.msg("Everything cleared. Press the big button to begin again.", "ok");
};

/* --- settings --- */
function fillSelect(el, values, cur, suffix){
  el.innerHTML = values.map(v => `<option value="${v}"${v === cur ? " selected" : ""}>${v}${suffix||""}</option>`).join("");
}
fillSelect($("selLen"), [15,18,20,22,25], scrLen);
$("selLen").onchange    = () => { scrLen = +$("selLen").value; LS.set("len", scrLen); };
$("selPrec").value = String(prec);
$("selPrec").onchange   = () => {
  prec = +$("selPrec").value === 3 ? 3 : 2;
  LS.set("prec", prec);
  paintTimes(); paintResults();
  ["A","B"].forEach(k => SIDES[k].redrawTime());
};

/* --- keep the screen awake while a battle is running --- */
(function(){
  const btn = $("btnWake");
  const supported = ("wakeLock" in navigator);
  let lock = null, on = LS.get("wake","1") !== "0";
  const mark = (cls, title) => { btn.className = "wake" + (cls ? " " + cls : ""); btn.title = title; };
  async function acquire(){
    if(!on) return;
    if(!supported){ mark("ng", "This environment cannot keep the screen on"); return; }
    if(lock) return;
    try{
      lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => { lock = null; });
      mark("on", "The screen will stay on (press to turn this off)");
    }catch(e){ lock = null; mark("ng", "Click the page to try again"); }
  }
  async function release(){ const l = lock; lock = null;
    try{ if(l) await l.release(); }catch(e){} mark(null, "Keep the screen on"); }
  btn.onclick = () => { on = !on; LS.set("wake", on ? "1" : "0"); on ? acquire() : release(); };
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible" && on && !lock) acquire(); });
  mark(null, "Keep the screen on");
  if(!supported) mark("ng", "This environment cannot keep the screen on");
  else if(on) acquire();
})();

/* --- Esc stops the battle --- */
document.addEventListener("keydown", e => { if(e.key === "Escape" && inPlay()) resetRound(); });

paintSort();
(function restoreSession(){                    // carry on where the last visit left off
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); }catch(e){}
  if(d && Array.isArray(d.log) && d.log.length) applySession(d, "your last session");
})();
paintHead(); paintResults(); paintTimes(); paintEngine();
/* the tables take a couple of seconds to build, and never while a solve is running */
(function armSolver(){
  setTimeout(() => {
    if(SIDES.A.phase() === SOLVING || SIDES.B.phase() === SOLVING) armSolver();
    else solverInit();
  }, 1500);
})();

/* For testing without cubes (not shown on screen):
   __battle.A.move("R")  turns a move on side A. */
window.__battle = {A: SIDES.A, B: SIDES.B,
  joinA: v => { aForce = !!v; paintHead(); },      // stand in for the cubes
  joinB: v => { bForce = !!v; paintHead(); },
  state: () => ({round: round, inPlay: inPlay(), log: log,
                 ghostNo: curScr || null,
                 solo: isSolo(), scrNo: curScr, scrN: scrList.length,
                 pa: SIDES.A.phase(), pb: SIDES.B.phase()})};
})();
</script>
